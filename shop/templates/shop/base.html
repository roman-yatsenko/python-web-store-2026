<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Літера{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body class="is-flex is-flex-direction-column" style="min-height: 100vh;">
    <header>
        <nav class="navbar is-white has-shadow" aria-label="Головна навігація">
            <div class="container">
                <div class="navbar-brand">
                    <a class="navbar-item has-text-weight-bold is-size-4" href="/">
                        Літера
                    </a>
                </div>
                <div class="navbar-end">
                    <div class="navbar-item">
                        <a class="button is-light" href="#cart" aria-label="Відкрити кошик" title="Кошик">
                            <span class="icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                     stroke-linejoin="round">
                                    <path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"></path>
                                    <circle cx="10" cy="21" r="1"></circle>
                                    <circle cx="19" cy="21" r="1"></circle>
                                </svg>
                            </span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="section is-flex-grow-1">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="content has-text-centered">
            <p>Літера — інтернет-магазин книг</p>
        </div>
    </footer>
</body>
</html>
